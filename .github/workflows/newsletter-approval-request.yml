name: Newsletter daily draft

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 03:30 UTC = 09:00 IST.
    - cron: "30 3 * * *"

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare newsletter draft
        run: node scripts/prepare-newsletter-draft.mjs
